<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img"><title>Scaff It example project folder with shared plans, decisions, and progress</title><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1280" height="680" rx="24" fill="#F0E8D0" /><text x="56" y="63" font-size="15" fill="#6A1828" font-weight="600" letter-spacing="2">SCAFF IT / AN ORGANISED START</text><text x="56" y="125" font-size="42" fill="#200808" font-weight="600" >One project folder. A clear plan for every AI.</text><rect x="56" y="170" width="650" height="450" rx="18" fill="#200808" /><rect x="56" y="170" width="650" height="48" rx="18" fill="#6A1828" /><rect x="56" y="194" width="650" height="24" rx="0" fill="#6A1828" /><text x="82" y="201" font-size="17" fill="#F0E8D0" font-weight="600" >Example project folder</text><g font-family="Cascadia Mono, Consolas, monospace"><text x="88" y="258" font-size="23" fill="#B09050" font-weight="600" >My Project/</text><text x="88" y="292" font-size="23" fill="#F0E8D0" font-weight="400" >|-- PROJECT_SPEC.md</text><text x="88" y="326" font-size="23" fill="#F0E8D0" font-weight="400" >|-- AGENTS.md</text><text x="88" y="360" font-size="23" fill="#B09050" font-weight="400" >|-- .agent/</text><text x="88" y="394" font-size="23" fill="#F0E8D0" font-weight="400" >|   |-- DECISIONS.md</text><text x="88" y="428" font-size="23" fill="#F0E8D0" font-weight="400" >|   |-- CHECKPOINT.md</text><text x="88" y="462" font-size="23" fill="#F0E8D0" font-weight="400" >|   `-- PLANS.md</text><text x="88" y="496" font-size="23" fill="#F0E8D0" font-weight="400" >|-- src/</text><text x="88" y="530" font-size="23" fill="#F0E8D0" font-weight="400" >|-- tests/</text><text x="88" y="564" font-size="23" fill="#F0E8D0" font-weight="400" >`-- docs/</text></g><text x="756" y="215" font-size="24" fill="#200808" font-weight="600" >A shared place for the essentials</text><rect x="756" y="252" width="37" height="32" rx="8" fill="#A02838" /><text x="764" y="275" font-size="15" fill="#F0E8D0" font-weight="600" >01</text><text x="810" y="276" font-size="24" fill="#200808" font-weight="600" >The plan</text><text x="810" y="308" font-size="20" fill="#6A1828" font-weight="400" >What you want to build.</text><rect x="756" y="346" width="37" height="32" rx="8" fill="#A02838" /><text x="764" y="369" font-size="15" fill="#F0E8D0" font-weight="600" >02</text><text x="810" y="370" font-size="24" fill="#200808" font-weight="600" >The decisions</text><text x="810" y="402" font-size="20" fill="#6A1828" font-weight="400" >What has been agreed.</text><rect x="756" y="440" width="37" height="32" rx="8" fill="#A02838" /><text x="764" y="463" font-size="15" fill="#F0E8D0" font-weight="600" >03</text><text x="810" y="464" font-size="24" fill="#200808" font-weight="600" >The progress</text><text x="810" y="496" font-size="20" fill="#6A1828" font-weight="400" >Where things stand and what is next.</text><text x="756" y="575" font-size="21" fill="#6A1828" font-weight="600" >Change AI assistants.</text><text x="756" y="606" font-size="21" fill="#6A1828" font-weight="600" >Keep the same project information.</text><text x="56" y="657" font-size="15" fill="#6A1828" font-weight="400" >Illustrative excerpt. Included files depend on your choices; you and your AI keep the notes up to date.</text></g></svg>